# สภาพแวดล้อม dev เท่านั้น - prod ใช้ Railway (Postgres) + Cloudflare R2 (Storage)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ocec-postgres
    environment:
      POSTGRES_USER: ocec
      POSTGRES_PASSWORD: ocec
      POSTGRES_DB: ocec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocec"]
      interval: 5s
      timeout: 5s
      retries: 10

  # จำลอง Cloudflare R2 ตอน dev (S3-compatible เหมือนกัน)
  minio:
    # Docker Hub ไม่ให้ดึง minio/minio แล้ว ต้องใช้ registry ของ MinIO เอง
    image: quay.io/minio/minio:latest
    container_name: ocec-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # สร้าง bucket + เปิด public read สำหรับ prefix previews/ ให้อัตโนมัติ
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ocec-cert &&
      mc anonymous set download local/ocec-cert/previews &&
      echo 'minio ready: bucket ocec-cert';
      "

  # ตัวประมวลผล PDF/Excel — dev รันใน container เพราะต้องใช้ Python 3.12 + PyMuPDF
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev          # มี pytest/ruff และเปิด --reload ให้ด้วย
    container_name: ocec-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ในเครือข่ายของ compose ใช้ชื่อ service เป็น host (ไม่ใช่ localhost)
      DATABASE_URL: postgresql://ocec:ocec@postgres:5432/ocec
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: ocec-cert
      R2_FORCE_PATH_STYLE: "true"
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET:-dev-worker-secret}
      NORMALIZE_CASES_FILE: /shared/normalize-cases.json
    ports:
      - "8000:8000"
    volumes:
      # dev เท่านั้น: แก้โค้ดแล้วเห็นผลโดยไม่ต้อง build image ใหม่ และรัน pytest ในนี้ได้
      - ./apps/worker:/app
      - ./shared:/shared:ro

volumes:
  pgdata:
  miniodata:
