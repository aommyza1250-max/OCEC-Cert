<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">ภาพสรุปหน้ารวมรอบการนำเข้าของแอดมิน</title>
  <desc id="desc">ตารางเลือกปีและรายการสอบ แยกเป็นรอบคัดเลือกและรอบชิงชนะเลิศ เลือกช่องเพื่อเริ่มหรือเปิดรอบ</desc>
  <rect width="1040" height="560" rx="28" fill="#f5f8fc"/>
  <rect x="35" y="28" width="970" height="504" rx="22" fill="#fff" stroke="#d8e1eb" stroke-width="2"/>
  <text x="70" y="78" font-family="Noto Sans Thai, sans-serif" font-size="28" font-weight="700" fill="#173f70">รอบการนำเข้า</text>
  <text x="70" y="108" font-family="Noto Sans Thai, sans-serif" font-size="16" fill="#596b7e">เลือกรายการสอบและรอบที่ต้องการจัดการ</text>
  <rect x="70" y="136" width="900" height="60" rx="12" fill="#f7f9fc" stroke="#d8e1eb"/>
  <text x="94" y="173" font-family="Noto Sans Thai, sans-serif" font-size="16" fill="#596b7e">ปี</text>
  <rect x="123" y="149" width="130" height="34" rx="9" fill="#173f70"/><text x="188" y="173" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="15" font-weight="700" fill="#fff">ปีที่เลือก</text>
  <text x="925" y="173" text-anchor="end" font-family="Noto Sans Thai, sans-serif" font-size="14" fill="#596b7e">เลือกปีจากปุ่มด้านบน</text>
  <rect x="70" y="218" width="900" height="62" rx="10" fill="#edf2f7"/>
  <text x="96" y="256" font-family="Noto Sans Thai, sans-serif" font-size="16" font-weight="700" fill="#33485e">รายการสอบ</text>
  <text x="558" y="256" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="16" font-weight="700" fill="#33485e">รอบคัดเลือก</text>
  <text x="817" y="256" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="16" font-weight="700" fill="#33485e">รอบชิงชนะเลิศ</text>
  <g font-family="Noto Sans Thai, sans-serif" font-size="16">
    <rect x="70" y="280" width="900" height="65" fill="#fff" stroke="#e3e9f0"/><text x="96" y="320" font-weight="700" fill="#173f70">HKIMO</text><text x="558" y="320" text-anchor="middle" fill="#173f70">เผยแพร่แล้ว · 0 ใบ</text><text x="817" y="320" text-anchor="middle" fill="#173f70">ยังไม่เผยแพร่ · 0 ใบ</text>
    <rect x="70" y="345" width="900" height="65" fill="#fbfcfe" stroke="#e3e9f0"/><text x="96" y="385" font-weight="700" fill="#173f70">TIMO</text><rect x="435" y="359" width="246" height="37" rx="8" fill="#fff" stroke="#cbd6e2" stroke-dasharray="6 4"/><text x="558" y="384" text-anchor="middle" fill="#53677b">+ เริ่มนำเข้า</text><text x="817" y="385" text-anchor="middle" fill="#173f70">ยังไม่มีรายชื่อ · 0 ใบ</text>
    <rect x="70" y="410" width="900" height="65" fill="#fff" stroke="#e3e9f0"/><text x="96" y="450" font-weight="700" fill="#173f70">HKISO</text><text x="558" y="450" text-anchor="middle" fill="#78889a">ยังไม่รองรับ</text><rect x="694" y="423" width="246" height="37" rx="8" fill="#f3f5f8"/><text x="817" y="448" text-anchor="middle" fill="#596b7e">เปิดรอบที่มีอยู่</text>
  </g>
  <text x="520" y="505" text-anchor="middle" font-family="Noto Sans Thai, sans-serif" font-size="15" fill="#596b7e">ภาพสรุป: คลิกช่องของรายการสอบและรอบที่ต้องการ</text>
</svg>
