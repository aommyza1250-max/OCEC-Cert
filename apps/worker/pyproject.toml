[project]
name = "ocec-worker"
version = "0.1.0"
description = "ตัวประมวลผลไฟล์เกียรติบัตร: ตัดแยกหน้า PDF, สร้างรูป preview, จับคู่กับรายชื่อ Excel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.35",
    "PyMuPDF>=1.24",
    "Pillow>=11.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.tasks", "app.certificate_profiles"]
